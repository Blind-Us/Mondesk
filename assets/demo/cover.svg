<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- demo album cover (made up): a low sun over a desk horizon -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2350"/><stop offset=".55" stop-color="#c2577a"/><stop offset="1" stop-color="#f3a35b"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1c9"/><stop offset=".7" stop-color="#ffd27a"/><stop offset="1" stop-color="#ffb35a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="318" r="104" fill="url(#sun)"/>
  <g fill="#ffe7b0" opacity=".9">
    <rect x="132" y="300" width="248" height="6" rx="3" opacity=".35"/>
    <rect x="150" y="320" width="212" height="6" rx="3" opacity=".3"/>
  </g>
  <rect y="352" width="512" height="160" fill="#1d1830"/>
  <rect y="352" width="512" height="5" fill="#f7c27a" opacity=".6"/>
  <g fill="#f2e9d8">
    <rect x="96" y="300" width="120" height="78" rx="10"/>
    <rect x="106" y="310" width="100" height="56" rx="5" fill="#1d1830"/>
    <rect x="140" y="378" width="32" height="10" rx="4"/>
  </g>
  <rect x="114" y="318" width="30" height="40" rx="3" fill="#e9b66b"/>
  <rect x="150" y="318" width="48" height="17" rx="3" fill="#f2e9d8"/>
  <rect x="150" y="341" width="48" height="17" rx="3" fill="#f2e9d8" opacity=".45"/>
</svg>
