<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mondesk</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=94">
</head>
<body>
<div id="stage">
  <header>
    <a id="gear" href="/settings.html" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
    <div class="brand"><i></i>MONDESK<em class="demo-tag">示範</em></div>
    <button id="mode" type="button" aria-label="切換情境模式">自訂</button>
    <button id="fs" type="button" aria-label="全螢幕" title="全螢幕" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <div id="date"></div>
    <div id="clock"></div>
  </header>
  <main id="grid"></main>
  <div id="toasts" aria-live="polite"></div>
  <div id="lyrics" hidden>
    <div class="ly-bg"></div>
    <div class="ly-head"><img class="ly-art" alt=""><div><div class="ly-title"></div><div class="ly-artist"></div></div><span class="ly-close" role="button" tabindex="0" aria-label="關閉全螢幕頁面">✕</span></div>
    <div class="ly-body"><div class="ly-lines"></div></div>
    <img class="ly-video" alt="影片畫面" hidden>
    <div class="ly-video-msg" role="status" hidden></div>
    <div class="ly-ctl" hidden>
      <button type="button" class="ly-play" aria-label="播放／暫停"></button>
      <span class="ly-time" aria-hidden="true"></span>
      <label class="ly-vol"><span class="ly-vol-ic" aria-hidden="true"></span><input type="range" min="0" max="100" step="1" value="100" aria-label="影片音量"></label>
    </div>
    <div class="ly-bar"><div></div><input class="ly-seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="播放進度" disabled></div>
  </div>
</div>
<script src="api.js?v=1"></script>
<script src="layout.js?v=33"></script>
<script src="media-route.js?v=5"></script>
<script src="video-sync.js?v=4"></script>
<script src="printer-render.js?v=1"></script>
<script src="companion.js?v=5"></script>
<script src="clock-widget.js?v=8"></script>
<script src="app.js?v=85"></script>
<script src="panel-edit.js?v=9"></script>
</body>
</html>
