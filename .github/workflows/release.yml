# Builds the Mondesk application for Windows and Linux.
#   * push a tag like v1.0.0  -> both packages are attached to a GitHub Release of that tag
#   * "Run workflow" by hand  -> the packages are kept as artifacts of the run (for trying them out)
# Each package is started once on the build machine (tools/build_app.py self-test) before it is published.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows ships python.org's embeddable Python of this exact version (tools/build_app.py)
          - os: windows-latest
            python: "3.15"
          # the Linux package runs on systems with this glibc or newer (PyInstaller bundles libpython built
          # against it): 22.04 -> glibc 2.35, so Ubuntu 22.04+, Debian 12+, Fedora 36+. Not ubuntu-latest.
          - os: ubuntu-22.04
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: python -m pip install -r requirements-desktop.txt -r requirements-build.txt
      - name: Check
        run: python tools/check.py
      - name: Build
        run: python tools/build_app.py
      # the package must start on clean systems: nothing installed but the distribution's base image
      # (no Python, no packages, no PATH tools), as a downloaded tar.gz would
      - name: Try the Linux package on clean systems
        if: runner.os == 'Linux'
        run: |
          for image in ubuntu:22.04 debian:12-slim fedora:41 archlinux:latest; do
            echo "== $image"
            docker run --rm -v "$PWD/dist:/dist:ro" "$image" sh -c \
              'mkdir /t && tar xzf /dist/Mondesk-linux.tar.gz -C /t && /t/Mondesk/Mondesk --self-test /t/r.json && cat /t/r.json && grep -q "\"child_env\": true" /t/r.json'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Mondesk-${{ runner.os }}
          path: |
            dist/Mondesk-windows.zip
            dist/Mondesk-linux.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
